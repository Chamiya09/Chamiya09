      <use href="#blossom" x="1066" y="23"/><use href="#blossom" x="1087" y="10"/><use href="#blossom" x="1102" y="29"/><use href="#blossom" x="1113" y="55"/><use href="#blossom" x="1147" y="43"/>
      <use href="#blossom" x="1161" y="73"/><use href="#blossom" x="1134" y="89"/><use href="#blossom" x="1108" y="109"/><use href="#blossom" x="1151" y="98"/><use href="#blossom" x="1189" y="23"/>
    </g>
    <g class="float" fill="#F9A8D4" opacity=".65">
      <path d="M1080 151q9-5 7 2-5 5-7-2ZM1161 201q8-6 8 1-4 6-8-1ZM822 219q7-4 6 2-5 3-6-2Z"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-14 14;0 0" dur="18s" repeatCount="indefinite"/>
    </g>
    <!-- Base values show the first role even when SMIL is unavailable. -->
    <g transform="translate(64 0)">
      <path d="M0 112h25" stroke="#A78BFA" stroke-width="2"/>
      <text x="36" y="117" fill="#B8B5D8" font-size="12" letter-spacing="3">CODE UNDER THE STARS</text>
      <text x="0" y="181" fill="#F8FAFC" font-size="39" font-weight="650" letter-spacing="-1.1">Hi, I'm Chamod Ekanayaka</text>
      <text x="0" y="232" class="mono" fill="#A78BFA" font-size="22">&gt;</text>
      <g fill="#DDE7FF" font-size="23">
        <text x="29" y="232" class="role role-first" opacity="1">Software Engineer<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.16;.2;.96;1" dur="25s" repeatCount="indefinite"/></text>
        <text x="29" y="232" class="role" opacity="0">Full Stack Developer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.2;.36;.4;1" dur="25s" repeatCount="indefinite"/></text>
        <text x="29" y="232" class="role" opacity="0">AI &amp; Machine Learning Enthusiast<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.36;.4;.56;.6;1" dur="25s" repeatCount="indefinite"/></text>
        <text x="29" y="232" class="role" opacity="0">Passionate Coder<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.56;.6;.76;.8;1" dur="25s" repeatCount="indefinite"/></text>
        <text x="29" y="232" class="role" opacity="0">Turning Ideas into Reality<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.76;.8;.96;1" dur="25s" repeatCount="indefinite"/></text>
      </g>
      <path class="cursor" d="M439 216v20" stroke="#F9A8D4" stroke-width="2" opacity="1"><animate attributeName="opacity" values="1;0;1" keyTimes="0;.5;1" calcMode="discrete" dur="1.6s" repeatCount="indefinite"/></path>
      <path d="M0 269h46" stroke="#68658D"/>
      <text x="0" y="302" fill="#A5ADC6" font-size="14" letter-spacing=".5">Quiet nights. Curious mind. Endless possibilities.</text>
      <text x="0" y="373" class="mono" fill="#777F9D" font-size="11" letter-spacing="1.5">&lt;/&gt;  DREAM / BUILD / REPEAT</text>
    </g>
    <rect x=".5" y=".5" width="1199" height="419" rx="20" fill="none" stroke="#A78BFA" stroke-opacity=".16"/>
  </g>
</svg>
