    <path d="M430 326C621 178 686 42 939-28h230C874 81 729 192 430 326Z" fill="url(#nebula)"/>
    <path d="M504 286C688 144 772 37 1004-24h86C868 69 728 184 504 286Z" fill="url(#nebula)" opacity=".65"/>
    <path d="M593 231C738 128 805 50 980 3" fill="none" stroke="#B9C5FF" stroke-opacity=".07" stroke-width="16" filter="url(#soft)"/>
    <ellipse cx="967" cy="264" rx="344" ry="112" fill="url(#horizon)"/>
    <g fill="#DDE7FF" opacity=".5">
      <path d="M610 192h1v1h-1zM642 166h1v1h-1zM666 183h1v1h-1zM675 144h1v1h-1zM692 156h1v1h-1zM712 120h1v1h-1zM730 137h1v1h-1zM745 103h1v1h-1zM761 119h1v1h-1zM778 78h1v1h-1zM801 61h1v1h-1zM817 76h1v1h-1zM838 44h1v1h-1zM864 57h1v1h-1zM883 25h1v1h-1zM906 41h1v1h-1zM933 17h1v1h-1zM956 30h1v1h-1zM991 12h1v1h-1z"/>
      <circle cx="698" cy="174" r=".7"/><circle cx="755" cy="87" r=".9"/><circle cx="790" cy="113" r=".6"/><circle cx="855" cy="80" r=".8"/><circle cx="891" cy="12" r=".7"/><circle cx="924" cy="59" r=".6"/>
    </g>
    <!-- Sparse constellations leave quiet space for the introduction. -->
    <g fill="#DDE7FF" opacity=".48">
      <circle cx="70" cy="54" r="1"/><circle cx="206" cy="92" r=".8"/><circle cx="328" cy="44" r="1"/><circle cx="465" cy="73" r=".8"/><circle cx="595" cy="36" r="1"/><circle cx="650" cy="123" r="1.2"/><circle cx="728" cy="63" r="1"/><circle cx="783" cy="140" r=".8"/><circle cx="854" cy="31" r="1"/><circle cx="1090" cy="43" r="1"/><circle cx="1145" cy="121" r="1.2"/><circle cx="1030" cy="183" r=".8"/><circle cx="713" cy="208" r=".8"/><circle cx="1110" cy="226" r="1"/><circle cx="568" cy="107" r=".7"/>
    </g>
    <g class="twinkle" fill="#DDE7FF" opacity=".65">
