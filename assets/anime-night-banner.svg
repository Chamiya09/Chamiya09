      <path d="M1010 190c20-10 44-12 64-9 25-20 57-17 77-3 27-7 55-1 87 12-59 10-165 10-228 0Z"/>
      <animateTransform attributeName="transform" type="translate" values="-12 0;16 0;-12 0" dur="40s" repeatCount="indefinite"/>
    </g>
    <g class="drift" fill="url(#cloud)" opacity=".6">
      <path d="M557 92c25-11 41-9 59-8 22-19 43-15 66-3 30-7 63 0 89 13-73 4-140 5-214-2Z"/>
      <animateTransform attributeName="transform" type="translate" values="10 0;-15 0;10 0" dur="51s" repeatCount="indefinite"/>
    </g>
    <!-- Layered hills, distant apartments and warm windows. -->
    <path d="m569 285 91-42 30 6 111-102 28 26 17 5 78 78 64-29 34 8 66-47 112 94v65H569Z" fill="url(#ridge)" opacity=".58"/>
    <path d="m748 197 53-50 28 26 17 5 25 25-32-15-11 2-13-18-14 10-10-6-15 17-13-1Z" fill="#C9C4E7" opacity=".34"/>
    <path d="m635 263 64-8 53-27 47 7 65-9 49 20 81-2 69-20 137 22v43H635Z" fill="#8881B2" opacity=".13"/>
    <path d="M410 310 530 281 591 292 694 248 766 265 848 238 932 262 1034 230 1122 253 1200 237V420H410Z" fill="#25264B"/>
    <path d="M520 324 660 289 739 307 836 277 949 300 1090 272 1200 283V420H520Z" fill="#1A203D"/>
    <path d="M594 358v-37h32v-29h39v66h17v-48h34v-39h46v87h21v-49h45v-19h25v68h28v-38h41v-46h39v84h18v-49h48v49h21v-66h30v-25h28v91h18v-40h41v-30h44v70h21v-49h46v111H594Z" fill="#141C34"/>
    <g opacity=".35"><use href="#windows" x="638" y="306"/><use href="#windows" x="725" y="287"/><use href="#windows" x="795" y="321"/><use href="#windows" x="891" y="290"/><use href="#windows" x="1038" y="284"/><use href="#windows" x="1121" y="304"/></g>
    <path d="M634 363 680 344 723 359h45l46-23 48 23h48l33-18 45 22h212v57H634Z" fill="#101729"/>
    <path d="M666 345 680 339 727 357M798 341l16-10 50 25" fill="none" stroke="#505078" stroke-opacity=".5" stroke-width="2"/>
    <!-- The near rooftop: a quiet place to build something. -->
    <path d="M776 354H1200V420H753Z" fill="#0B1020"/>
    <path d="M772 352H1200V361H768Z" fill="#30324D"/>
    <path d="M775 352H1200" stroke="#A78BFA" stroke-opacity=".38"/>
    <g stroke="#29263E" stroke-width="1" opacity=".65"><path d="M786 378h414M774 402h426M835 361l-12 59M1037 361l17 59M1151 361l30 59"/></g>
    <g stroke="#3E405C" stroke-width="2"><path d="M1080 352v-91m70 91v-91m49 91v-91M1065 270h135M1065 292h135"/></g>
    <path d="M1142 262v-53m-17 13h35m-29 10h23" stroke="#191D35" stroke-width="2"/>
    <ellipse cx="962" cy="319" rx="85" ry="65" fill="url(#screenGlow)"/>
    <!-- Original seated figure, backlit hair, loose jacket and folded legs. -->
    <path d="M910 266c-8-3-15-13-12-24 1-9 11-15 22-12 10 3 13 13 9 23l-5 10 2 12-15 4Z" fill="#0B1020"/>
    <path d="m899 246-5-6 7-1-1-7 8 1 5-7 5 5 8-1 4 7 5 4-6 7-5-9-12-1Z" fill="#0B1020"/>
    <path d="M910 270c-17 3-23 27-23 52l13 13 35-7-3-32-6-24Z" fill="#10182B"/>
    <path d="M912 273c-10 8-15 22-15 42m24-42 7 19 19 16" fill="none" stroke="#6A719A" stroke-opacity=".5" stroke-width="2"/>
    <path d="m925 288 19 20 23 6-3 7-31-9-17-16" fill="#171F35"/>
    <path d="M899 323c9 0 24-1 34 2l28 16 19 3-1 8h-27l-33-15-16 1Z" fill="#0B1020"/>
    <path d="m909 334 22 11-7 34-10 13-8-4 10-17 1-21-22-13Z" fill="#0B1020"/>
    <path d="m914 391-9-4-6 7 1 4h18l1-5Z" fill="#080D1A"/>
    <path d="m925 238 4 7-2 10" fill="none" stroke="#A7B6DE" stroke-opacity=".4"/>
    <!-- Laptop rests on the raised knee, its screen turned toward the figure. -->
    <path d="m955 320 11-30 38 2-11 29Z" fill="#263D5B" stroke="#8AB9F0" stroke-width="1.2"/>
    <path d="m960 316 8-22 31 1-8 22Z" fill="#60A5FA" fill-opacity=".22"/>
    <path d="m948 322 45-1 8 4h-47Z" fill="#8CA7C9"/>
    <path d="m976 301-4 3 2 3m12-6 2 3-4 3m-3-7-4 9" fill="none" stroke="#DDE7FF" stroke-width="1.2"/>
    <g class="float" fill="#F9A8D4" opacity=".65">
      <ellipse cx="837" cy="296" rx="2.4" ry="1.2" transform="rotate(-30 837 296)"/><ellipse cx="1056" cy="238" rx="2" ry="1"/><circle cx="1022" cy="330" r="1.3"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;5 -9;0 0" dur="12s" repeatCount="indefinite"/>
    </g>
    <rect width="730" height="420" fill="url(#shade)"/>
    <!-- Foreground sakura branches frame the sky without crossing the text. -->
