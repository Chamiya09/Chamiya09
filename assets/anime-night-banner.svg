      <animate attributeName="opacity" values="0;0;.85;0;0" keyTimes="0;.73;.76;.81;1" dur="18s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;148 54;148 54" keyTimes="0;.73;.81;1" dur="18s" repeatCount="indefinite"/>
    </g>
    <g class="drift" fill="url(#cloud)">
