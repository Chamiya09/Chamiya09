<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Hi, I'm Chamod Ekanayaka</title>
  <desc id="description">A peaceful moonlit rooftop, a developer with a glowing laptop, and a lavender city beneath drifting clouds. Software Engineer; Full Stack Developer; AI and Machine Learning Enthusiast; Passionate Coder; Turning Ideas into Reality.</desc>
  <defs>
    <linearGradient id="sky" x2="1" y2="1">
      <stop stop-color="#080F21"/><stop offset=".45" stop-color="#171C44"/><stop offset=".78" stop-color="#35265F"/><stop offset="1" stop-color="#61456E"/>
    </linearGradient>
    <radialGradient id="atmosphere"><stop stop-color="#A78BFA" stop-opacity=".25"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo"><stop stop-color="#DDE7FF" stop-opacity=".24"/><stop offset=".45" stop-color="#A7BFFF" stop-opacity=".1"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>
    <linearGradient id="moon" x2=".7" y2="1"><stop stop-color="#F8FAFC"/><stop offset="1" stop-color="#B6C7F0"/></linearGradient>
    <linearGradient id="cloud" x2="0" y2="1"><stop stop-color="#A7A1DC" stop-opacity=".2"/><stop offset="1" stop-color="#8F88CF" stop-opacity=".02"/></linearGradient>
    <linearGradient id="shade"><stop stop-color="#0B1020" stop-opacity=".75"/><stop offset="1" stop-color="#0B1020" stop-opacity="0"/></linearGradient>
    <linearGradient id="trail"><stop stop-color="#DDE7FF" stop-opacity="0"/><stop offset="1" stop-color="#DDE7FF"/></linearGradient>
    <radialGradient id="screenGlow"><stop stop-color="#60A5FA" stop-opacity=".28"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2"/></filter>
    <linearGradient id="nebula" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#60A5FA" stop-opacity="0"/><stop offset=".45" stop-color="#9FA9FF" stop-opacity=".16"/><stop offset=".7" stop-color="#F9A8D4" stop-opacity=".18"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
    <radialGradient id="horizon"><stop stop-color="#F9A8D4" stop-opacity=".22"/><stop offset="1" stop-color="#F9A8D4" stop-opacity="0"/></radialGradient>
    <linearGradient id="ridge" x2="0" y2="1"><stop stop-color="#77729C"/><stop offset="1" stop-color="#303052"/></linearGradient>
    <g id="blossom" fill="#D99BC9"><ellipse cy="-3" rx="2.5" ry="3.5"/><ellipse cx="3" cy="-1" rx="3.5" ry="2.5" transform="rotate(-25 3 -1)"/><ellipse cx="2" cy="3" rx="2.5" ry="3.5" transform="rotate(-30 2 3)"/><ellipse cx="-2" cy="3" rx="2.5" ry="3.5" transform="rotate(30 -2 3)"/><ellipse cx="-3" cy="-1" rx="3.5" ry="2.5"/><circle r="1.2" fill="#FFE0EC"/></g>
    <clipPath id="frame"><rect width="1200" height="420" rx="20"/></clipPath>
    <path id="spark" d="M0-4 1-1 4 0 1 1 0 4-1 1-4 0-1-1Z"/>
    <g id="windows" fill="#F9D3B3"><path d="M0 0h3v5H0zM12 0h3v5h-3zM0 13h3v5H0zM24 13h3v5h-3zM12 26h3v5h-3zM24 39h3v5h-3z"/></g>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .mono { font-family: Consolas, 'Courier New', monospace; }
      @media (prefers-reduced-motion: reduce) {
        .drift, .float, .meteor { transform: none !important; }
        .twinkle { opacity: .65 !important; }
        .moon-halo { opacity: .8 !important; }
        .meteor, .role { opacity: 0 !important; }
        .role-first, .cursor { opacity: 1 !important; }
      }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#sky)"/>
    <ellipse cx="950" cy="290" rx="480" ry="290" fill="url(#atmosphere)"/>
