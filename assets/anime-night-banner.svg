      <path d="M1216 10c-61 12-95 44-147 50-35 4-64-9-92-18" stroke="#14162D" stroke-width="11"/>
      <path d="M1177 26c-23 35-30 64-69 84m24-65c-16-17-39-22-68-23m17 37c-15 18-32 25-53 27m130-49 3 36" stroke="#1C1B35" stroke-width="5"/>
      <path d="m1103 29-15-20m-30 62-14-4m88 25 19 5m-136-46-6-16" stroke="#29213F" stroke-width="2"/>
    </g>
    <g opacity=".8">
